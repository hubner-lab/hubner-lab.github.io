name: Update publications from Google Scholar

on:
  schedule:
    # Google Scholar blocks the runner on roughly two attempts in three, and
    # a blocked attempt leaves the data untouched. Six attempts a day makes a
    # same-day refresh ~91% likely instead of 33%. Free: public repo.
    - cron: '0 */4 * * *'   # every 4 hours
  workflow_dispatch:        # manual trigger for testing

permissions:
  contents: write

jobs:
  update:
    name: Fetch & commit
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with members-sync.yml, so the two bots never push to main at the
    # same moment. A run that arrives while the other holds the group waits.
    concurrency:
      group: main-writer
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.commit.outputs.changes_detected }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run scraper
        run: python scripts/scholar.py

      - name: Commit if changed
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: update publications.json from Google Scholar'
          # The list, and the day each paper was first seen (scripts/scholar.py, stamp_seen).
          file_pattern: src/data/publications.json src/data/publications-seen.json
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com

  # git-auto-commit pushes with GITHUB_TOKEN, and GitHub does not fire workflows
  # from GITHUB_TOKEN-authored pushes, so deploy.yml's `on: push` never runs for
  # these commits. Call it directly instead. It deploys the branch tip, never a
  # pinned commit: members-sync.yml also commits to main, and a pinned SHA could
  # publish a tree that lacks the other bot's newer commit.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: main
